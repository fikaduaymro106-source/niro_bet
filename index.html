<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Telegram Casino Mini App</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        body {
            background: radial-gradient(circle, #1a1a2e 0%, #0f0f1a 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            font-size: 26px;
        }
        .balance-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            padding: 10px 20px;
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
        }
        .balance-card span {
            color: #ffd700;
        }
        /* Slot Machine Styles */
        .slot-container {
            background: #252538;
            border: 4px solid #ffd700;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        .reel {
            background: #111;
            border: 2px solid #444;
            border-radius: 10px;
            width: 70px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            box-shadow: inset 0 0 10px #000;
            transition: transform 0.1s ease;
        }
        .spinning {
            animation: bounce 0.1s infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(-5px); }
            to { transform: translateY(5px); }
        }
        /* Controls */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 280px;
        }
        .bet-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #bbb;
        }
        .spin-btn {
            background: linear-gradient(180deg, #ffb700, #ff8800);
            border: none;
            border-radius: 30px;
            color: #000;
            font-size: 20px;
            font-weight: bold;
            padding: 15px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 136, 0, 0.4);
            transition: transform 0.1s, filter 0.2s;
        }
        .spin-btn:active {
            transform: scale(0.96);
        }
        .spin-btn:disabled {
            background: #555;
            color: #888;
            box-shadow: none;
            cursor: not-allowed;
        }
        .message {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            height: 24px;
            text-align: center;
        }
        .win {
            color: #00ff88;
            text-shadow: 0 0 10px #00ff88;
        }
        .lose {
            color: #ff4d4d;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="user-name">🎰 Casino Slot</h1>
        <div class="balance-card">
            Balance: <span id="balance">1000</span> 🪙
        </div>
    </div>

    <!-- ማሽኑ -->
    <div class="slot-container">
        <div class="reel" id="reel1">🍒</div>
        <div class="reel" id="reel2">🍋</div>
        <div class="reel" id="reel3">🍇</div>
    </div>

    <div class="controls">
        <div class="bet-info">
            <span>የውርርድ ዋጋ፡</span>
            <span style="color: #ffd700;">50 Coins</span>
        </div>
        <button class="spin-btn" id="spin-btn" onclick="spin()">SPIN</button>
        <div class="message" id="message"></div>
    </div>

    <script>
        // ቴሌግራም WebApp ማዘጋጀት
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            // የተጠቃሚውን ስም ከቴሌግራም ማምጣት
            if (tg.initDataUnsafe?.user) {
                document.getElementById('user-name').innerText = `🎰 ${tg.initDataUnsafe.user.first_name}'s Casino`;
            }
        }

        const symbols = ['🍒', '🍋', '🍇', '🔔', '💎', '7️⃣'];
        let balance = 1000;
        const betAmount = 50;

        const reel1 = document.getElementById('reel1');
        const reel2 = document.getElementById('reel2');
        const reel3 = document.getElementById('reel3');
        const spinBtn = document.getElementById('spin-btn');
        const balanceDisplay = document.getElementById('balance');
        const messageDisplay = document.getElementById('message');

        function getRandomSymbol() {
            return symbols[Math.floor(Math.random() * symbols.length)];
        }

        function spin() {
            if (balance < betAmount) {
                messageDisplay.innerText = "ገንዘብዎ አነስተኛ ነው!";
                messageDisplay.className = "message lose";
                return;
            }

            // ሂሳብ መቀነስ
            balance -= betAmount;
            balanceDisplay.innerText = balance;
            messageDisplay.innerText = "";
            spinBtn.disabled = true;

            // ማሽከርከር (Animation)
            reel1.classList.add('spinning');
            reel2.classList.add('spinning');
            reel3.classList.add('spinning');

            let counter = 0;
            const spinInterval = setInterval(() => {
                reel1.innerText = getRandomSymbol();
                reel2.innerText = getRandomSymbol();
                reel3.innerText = getRandomSymbol();
                counter++;

                if (counter > 15) {
                    clearInterval(spinInterval);
                    finishSpin();
                }
            }, 80);
        }

        function finishSpin() {
            reel1.classList.remove('spinning');
            reel2.classList.remove('spinning');
            reel3.classList.remove('spinning');

            const res1 = getRandomSymbol();
            const res2 = getRandomSymbol();
            const res3 = getRandomSymbol();

            reel1.innerText = res1;
            reel2.innerText = res2;
            reel3.innerText = res3;

            // ውጤት ማረጋገጥ
            if (res1 === res2 && res2 === res3) {
                // 3ቱም ሲመሳሰሉ (ጃክፖት)
                let winPrize = 300;
                if (res1 === '7️⃣') winPrize = 1000; // ሰባት ከመጣ ትልቅ ሽልማት
                
                balance += winPrize;
                messageDisplay.innerText = `🎉 ጃክፖት! +${winPrize} Coins አሸነፉ!`;
                messageDisplay.className = "message win";
                
                // ለቴሌግራም Haptic Feedback
                if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else if (res1 === res2 || res2 === res3 || res1 === res3) {
                // 2ቱ ሲመሳሰሉ
                const smallWin = 80;
                balance += smallWin;
                messageDisplay.innerText = `👏 አሪፍ ነው! +${smallWin} Coins!`;
                messageDisplay.className = "message win";
            } else {
                messageDisplay.innerText = "አላሸነፉም! እንደገና ይሞክሩ።";
                messageDisplay.className = "message lose";
            }

            balanceDisplay.innerText = balance;
            spinBtn.disabled = false;
        }
    </script>
</body>
</html>
