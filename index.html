<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Niro Bet Casino</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #0c0f14;
            --bg-card: #151c24;
            --accent-green: #00c853;
            --accent-red: #e52538;
            --border-color: #202b38;
            --text-muted: #8b98a5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-main); color: #fff; padding-bottom: 75px; overflow-x: hidden; }

        /* Top Header */
        .top-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #121820; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        .logo-box { display: flex; align-items: center; gap: 6px; font-weight: 900; font-size: 1.15rem; color: #fff; }
        .logo-badge { background: #ff9800; color: #000; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 800; }
        .header-actions { display: flex; align-items: center; gap: 8px; }
        .balance-badge { background: #1a232e; border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; color: #00e676; }
        .btn-deposit-top { background: var(--accent-green); color: #000; border: none; padding: 7px 14px; border-radius: 6px; font-weight: bold; font-size: 0.85rem; cursor: pointer; }

        /* Banner */
        .promo-banner { margin: 12px; padding: 16px; background: linear-gradient(135deg, #124018, #071f0c); border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #1e6328; }
        .promo-banner h3 { font-size: 1.05rem; color: #fff; }
        .promo-banner p { font-size: 0.8rem; color: #a5d6a7; margin-top: 4px; }

        /* Wins Ticker */
        .section-title { padding: 10px 14px 6px; font-size: 0.9rem; font-weight: bold; color: #fff; display: flex; justify-content: space-between; align-items: center; }
        .section-title span { color: var(--text-muted); font-size: 0.75rem; }
        .wins-ticker { display: flex; gap: 10px; overflow-x: auto; padding: 0 14px 10px; scrollbar-width: none; }
        .wins-ticker::-webkit-scrollbar { display: none; }
        .win-item { min-width: 110px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 8px; text-align: center; }
        .win-item .game-name { font-size: 0.75rem; color: var(--text-muted); }
        .win-item .win-amt { font-size: 0.8rem; color: #00e676; font-weight: bold; margin-top: 2px; }

        /* Realistic Game Cards Grid */
        .game-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px 14px; }
        .game-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; text-align: center; cursor: pointer; transition: transform 0.1s; position: relative; }
        .game-card:active { transform: scale(0.96); }
        .game-thumb { height: 95px; width: 100%; object-fit: cover; display: block; background: #1c2633; }
        .badge-hot { position: absolute; top: 6px; left: 6px; background: #e52538; color: white; font-size: 0.6rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .game-title { padding: 8px 4px; font-size: 0.75rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Bottom Tab Navigation */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #11161d; border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000; }
        .nav-tab { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); font-size: 0.7rem; cursor: pointer; border: none; background: none; flex: 1; }
        .nav-tab.active { color: var(--accent-green); }
        .nav-tab .icon { font-size: 1.25rem; }

        /* Views */
        .app-view { display: none; }
        .app-view.active { display: block; }

        /* REALISTIC AVIATOR VIEW */
        .aviator-container { padding: 10px; max-width: 480px; margin: 0 auto; }
        .aviator-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.85rem; }
        .history-ribbon { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 8px; scrollbar-width: none; }
        .hist-chip { background: #1c2633; padding: 3px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; color: #ba68c8; }
        .hist-chip.high { color: #00e676; }

        .radar-screen { position: relative; width: 100%; height: 220px; background: radial-gradient(circle at 10% 90%, #291016 0%, #0c0f14 75%); border: 1px solid #33171f; border-radius: 12px; overflow: hidden; }
        .radar-canvas { width: 100%; height: 100%; display: block; }
        .radar-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: none; }
        .multiplier-val { font-size: 3.4rem; font-weight: 900; color: #fff; letter-spacing: -1px; text-shadow: 0 0 20px rgba(0,0,0,0.8); }
        .flew-text { font-size: 1.2rem; font-weight: 900; color: var(--accent-red); margin-top: 4px; display: none; letter-spacing: 1px; }

        /* Dual Betting Controls */
        .bet-dock { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .bet-box { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; padding: 8px; text-align: center; }
        .box-tabs { display: flex; justify-content: center; gap: 10px; font-size: 0.75rem; margin-bottom: 6px; color: var(--text-muted); }
        .num-control { display: flex; justify-content: space-between; align-items: center; background: #0c1015; border: 1px solid var(--border-color); border-radius: 6px; padding: 4px; margin-bottom: 6px; }
        .btn-step { background: none; border: none; color: #fff; font-size: 1.2rem; width: 28px; cursor: pointer; }
        .bet-input { width: 60px; text-align: center; background: none; border: none; color: #fff; font-weight: bold; font-size: 0.95rem; }
        .chip-presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 8px; }
        .chip-btn { background: #1c2633; border: none; color: var(--text-muted); border-radius: 4px; padding: 4px 0; font-size: 0.7rem; cursor: pointer; }
        .action-bet-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 0.95rem; font-weight: 900; color: #000; background: var(--accent-green); cursor: pointer; transition: 0.1s; }
        .action-bet-btn.cashing { background: #ff9800; color: #000; }

        /* SLOT GAME VIEW */
        .slot-box { background: #1c2633; border: 2px solid #ffb300; border-radius: 12px; padding: 20px 10px; margin: 20px auto; max-width: 320px; text-align: center; }
        .slot-reels { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; }
        .reel { width: 75px; height: 90px; background: #0c1015; border: 2px solid var(--border-color); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; }
        .btn-spin { width: 100%; padding: 14px; background: #ffb300; color: #000; border: none; border-radius: 8px; font-weight: 900; font-size: 1.1rem; cursor: pointer; }

        /* WALLET VIEW */
        .wallet-container { padding: 16px; max-width: 440px; margin: 0 auto; }
        .wallet-tabs { display: flex; background: var(--bg-card); border-radius: 8px; padding: 4px; border: 1px solid var(--border-color); margin-bottom: 16px; }
        .w-tab { flex: 1; padding: 10px; border: none; background: none; color: var(--text-muted); font-weight: bold; border-radius: 6px; cursor: pointer; }
        .w-tab.active { background: #243140; color: #fff; }
        .input-group { margin-bottom: 14px; text-align: left; }
        .input-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; }
        .input-field { width: 100%; padding: 12px; background: #0c1015; border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 0.95rem; }
        .method-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
        .method-card { border: 1px solid var(--border-color); background: var(--bg-card); border-radius: 8px; padding: 12px; text-align: center; cursor: pointer; }
        .method-card.selected { border-color: var(--accent-green); background: #0f2719; }
        .btn-submit-wallet { width: 100%; padding: 14px; background: var(--accent-green); color: #000; font-weight: bold; font-size: 1rem; border-radius: 8px; border: none; cursor: pointer; margin-top: 10px; }
    </style>
</head>
